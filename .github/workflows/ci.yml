# CI: PR 이 열리거나 커밋이 올라올 때마다, 그리고 main 이 바뀔 때마다 자동으로 검사한다.
# 이 검사(build)가 실패한 PR 은 리뷰를 보내지도, 합치지도 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: 빌드 · 단위 테스트 · lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      # 리뷰어가 직접 빌드하지 않고 이 APK 를 받아 에뮬레이터에 설치해도 된다.
      - name: APK 올리기
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 실패 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_id }}
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 7
